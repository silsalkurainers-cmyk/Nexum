name: Setup macOS dependencies

inputs:
  build-type:
    description: Type for the build
    required: true
    default: Debug

runs:
  using: composite

  steps:
    - name: Install dependencies
      shell: bash
      run: |
        brew update
        # GitHub-hosted runner downloads occasionally return transient 5xx errors.
        # Retry the complete dependency install; Homebrew safely skips packages already installed.
        for attempt in 1 2 3 4; do
          if brew install ninja extra-cmake-modules temurin@17 mono python@3.14; then
            exit 0
          fi
          echo "Homebrew dependency install failed (attempt $attempt/4); retrying..."
          sleep 20
        done
        echo "::error::Could not install macOS build dependencies after four attempts."
        exit 1

    - name: Add Homebrew Python to PATH
      shell: bash
      run: |
        echo "$(brew --prefix python@3.14)/bin" >> "$GITHUB_PATH"
        echo "$(brew --prefix python@3.14)/libexec/bin" >> "$GITHUB_PATH"
        python3 --version

    - name: Set JAVA_HOME
      shell: bash
      run: |
        echo "JAVA_HOME=$(/usr/libexec/java_home -v 17)" >> "$GITHUB_ENV"

    - name: Setup vcpkg cache
      if: ${{ inputs.build-type == 'Debug' }}
      shell: bash
      env:
        USERNAME: ${{ github.repository_owner }}
        GITHUB_TOKEN: ${{ github.token }}
        FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      run: |
        mono `vcpkg fetch nuget | tail -n 1` \
          sources add \
          -Source "$FEED_URL" \
          -StorePasswordInClearText \
          -Name GitHubPackages \
          -UserName "$USERNAME" \
          -Password "$GITHUB_TOKEN"
        mono `vcpkg fetch nuget | tail -n 1` \
          setapikey "$GITHUB_TOKEN" \
          -Source "$FEED_URL"
        echo "VCPKG_BINARY_SOURCES=clear;nuget,$FEED_URL,readwrite" >> "$GITHUB_ENV"

    - name: Setup vcpkg environment
      shell: bash
      run: |
        echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
