name: Build ChromeOS

concurrency:
  group: chromeos-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build-type:
        description: Build type
        type: choice
        options:
          - Release
          - Debug
        default: Release

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ChromeOS (Crostini) ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            artifact-name: ChromeOS-x86_64
          - os: ubuntu-24.04-arm
            arch: ARM64
            artifact-name: ChromeOS-ARM64

    runs-on: ${{ matrix.os }}
    env:
      ARTIFACT_NAME: ${{ matrix.artifact-name }}-Qt6
      BUILD_PLATFORM: official
      BUILD_TYPE: ${{ inputs.build-type || 'Release' }}
      LAUNCHER_VERSION: ${{ github.sha }}
      CMAKE_PRESET: ci
      VCPKG_FORCE_SYSTEM_BINARIES: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Restore required source dependencies
        shell: bash
        run: |
          mkdir -p cmake libraries
          git clone --depth 1 https://github.com/microsoft/vcpkg.git cmake/vcpkg
          git clone --depth 1 https://github.com/PrismLauncher/libnbtplusplus.git libraries/libnbtplusplus

      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: ${{ matrix.artifact-name }}
          qt-version: 6.11.2

      - name: Configure project
        shell: bash
        run: |
          NINJA_PATH="$(command -v ninja)"
          ninja --version
          for attempt in $(seq 1 10); do
            if cmake --preset "$CMAKE_PRESET" -D CMAKE_MAKE_PROGRAM="$NINJA_PATH" -D VCPKG_HOST_TRIPLET="$VCPKG_TRIPLET" -D VCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET" -D Launcher_VERSION_OVERRIDE="$LAUNCHER_VERSION"; then
              exit 0
            fi
            if [ -f build/vcpkg-bootstrap.log ] && grep -Eq 'curl: \(22\).*50[234]|curl operation failed with response code 50[234]|HTTP response code said error|HTTP status: 50[234]' build/vcpkg-bootstrap.log; then
              echo "Transient vcpkg HTTP error; retrying (attempt $attempt/10)"
              sleep 30
              continue
            fi
            [ ! -f build/vcpkg-bootstrap.log ] || cat build/vcpkg-bootstrap.log
            exit 1
          done
          exit 1

      - name: Build Nexum
        run: cmake --build --preset "$CMAKE_PRESET" --config "$BUILD_TYPE"

      - name: Run tests
        run: ctest --preset "$CMAKE_PRESET" --build-config "$BUILD_TYPE"

      - name: Package ChromeOS Linux build
        uses: ./.github/actions/package/linux
        with:
          version: ${{ github.sha }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}
          qt-version: ${{ steps.setup-dependencies.outputs.qt-version }}
