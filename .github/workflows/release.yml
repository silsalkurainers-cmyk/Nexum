name: Build Application and Make Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag for this Nexum release (for example, v0.1.0)
        required: true
        type: string

permissions: {}

jobs:
  build_release:
    name: Build Release
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      # Required for Azure Trusted Signing
      id-token: write
      # Required for vcpkg binary cache
      packages: write
    with:
      build-type: Release
      environment: Release
    secrets: inherit

  create_release:
    needs: build_release
    permissions:
      contents: write
    runs-on: ubuntu-slim
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: "true"
          ref: ${{ github.sha }}
          path: "Nexum-source"
      - name: Download artifacts
        uses: actions/download-artifact@v8
      - name: Grab and store version
        run: |
          VERSION="${{ inputs.release_tag || github.ref_name }}"
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid release tag: $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Package artifacts properly
        run: |
          mv ${{ github.workspace }}/Nexum-source Nexum-${{ env.VERSION }}
          mv Nexum-Linux-Qt6-Portable*/Nexum-portable.tar.gz Nexum-Linux-Qt6-Portable-${{ env.VERSION }}.tar.gz
          mv Nexum-Linux-aarch64-Qt6-Portable*/Nexum-portable.tar.gz Nexum-Linux-aarch64-Qt6-Portable-${{ env.VERSION }}.tar.gz
          mv Nexum-*.AppImage/Nexum-*-x86_64.AppImage Nexum-Linux-x86_64.AppImage
          mv Nexum-*.AppImage.zsync/Nexum-*-x86_64.AppImage.zsync Nexum-Linux-x86_64.AppImage.zsync
          mv Nexum-*.AppImage/Nexum-*-aarch64.AppImage Nexum-Linux-aarch64.AppImage
          mv Nexum-*.AppImage.zsync/Nexum-*-aarch64.AppImage.zsync Nexum-Linux-aarch64.AppImage.zsync
          mv Nexum-macOS*/Nexum.zip Nexum-macOS-${{ env.VERSION }}.zip
          mv Nexum-macOS*/Nexum.dmg Nexum-macOS-${{ env.VERSION }}.dmg

          tar --exclude='.git' -czf Nexum-${{ env.VERSION }}.tar.gz Nexum-${{ env.VERSION }}

          for d in Nexum-Windows-MSVC*; do
            cd "${d}" || continue
            LEGACY="$(echo -n ${d} | grep -o Legacy || true)"
            ARM64="$(echo -n ${d} | grep -o arm64 || true)"
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="Nexum-Windows-MSVC"
            test -z "${LEGACY}" || NAME="${NAME}-Legacy"
            test -z "${ARM64}" || NAME="${NAME}-arm64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv Nexum-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

          for d in Nexum-Windows-MinGW-w64*; do
            cd "${d}" || continue
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="Nexum-Windows-MinGW-w64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv Nexum-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Nexum ${{ env.VERSION }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            Nexum-Linux-x86_64.AppImage
            Nexum-Linux-x86_64.AppImage.zsync
            Nexum-Linux-aarch64.AppImage
            Nexum-Linux-aarch64.AppImage.zsync
            Nexum-Linux-Qt6-Portable-${{ env.VERSION }}.tar.gz
            Nexum-Linux-aarch64-Qt6-Portable-${{ env.VERSION }}.tar.gz
            Nexum-Windows-MinGW-w64-${{ env.VERSION }}.zip
            Nexum-Windows-MinGW-w64-Portable-${{ env.VERSION }}.zip
            Nexum-Windows-MinGW-w64-Setup-${{ env.VERSION }}.exe
            Nexum-Windows-MSVC-arm64-${{ env.VERSION }}.zip
            Nexum-Windows-MSVC-arm64-Portable-${{ env.VERSION }}.zip
            Nexum-Windows-MSVC-arm64-Setup-${{ env.VERSION }}.exe
            Nexum-Windows-MSVC-${{ env.VERSION }}.zip
            Nexum-Windows-MSVC-Portable-${{ env.VERSION }}.zip
            Nexum-Windows-MSVC-Setup-${{ env.VERSION }}.exe
            Nexum-macOS-${{ env.VERSION }}.zip
            Nexum-macOS-${{ env.VERSION }}.dmg
            Nexum-${{ env.VERSION }}.tar.gz
